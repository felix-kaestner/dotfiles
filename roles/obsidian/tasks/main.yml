---
- name: Install Obsidian
  community.general.homebrew_cask:
    name: "obsidian"
    state: present

- name: Create symbolic link for .obsidian.vimrc
  ansible.builtin.file:
    src: "{{ role_path }}/files/.obsidian.vimrc"
    dest: "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Vault/.obsidian.vimrc"
    state: link
    force: true
