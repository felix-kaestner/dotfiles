# Set prefix to Ctrl+j
set -g prefix C-j

# Enable mouse mode
setw -g mouse on

# Enable extended keys (CSI u) so apps like Neovim receive key combos that
# classic terminal encoding can't send, e.g. Ctrl+Enter or Shift+Enter
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Set preferred theme
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_status_background "none"

# Restoring vim and neovim sessions
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"

# Restoring pane contents
set -g @resurrect-capture-pane-contents "on"

# Enable automatic saving of tmux environment and restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Status Line
set -g status-position top
set -g status-justify absolute-centre
set -g status-left " #S "
set -g status-right " #H "
set -g status-left-length 100
set -g window-status-current-style "fg=blue bold"

# Increase the duration of the pane selection
set -g display-panes-time 2000

# Add Vim-like keybindings to move between panes
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Use Alt + vim keys to resize panes
bind-key -n M-h resize-pane -L 5
bind-key -n M-j resize-pane -D 5
bind-key -n M-k resize-pane -U 5
bind-key -n M-l resize-pane -R 5

# Equally distribute panes when a new pane is created
set-hook -g after-split-window "select-layout -E"

# Split panes using \ and -
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key -  split-window -v -c "#{pane_current_path}"

# Use v to start visual selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use y to yank current selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Use x to past current selection
bind-key -T copy-mode-vi x send-keys -X copy-pipe-and-cancel \; paste-buffer

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-sessionist"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "catppuccin/tmux"

bind-key -r b set -g status \;
bind-key -r f run-shell "~/.local/bin/tmuxs"
bind-key -r G run-shell "~/.local/bin/ghopen"
bind-key -r H run-shell "~/.local/bin/tmuxs ~/Developer/dotfiles"
bind-key -r J run-shell "~/.local/bin/tmuxs ~/Developer/tmp"
bind-key -r K run-shell "~/.local/bin/tmuxs ~/Developer/x"

# Initialize Plugin Manager
run "~/.config/tmux/plugins/tpm/tpm"

# vim: ft=tmux
